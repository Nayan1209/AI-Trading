services:
  app:
    build:
      context: ../..
    image: ai-trading:lightsail
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      TRUSTED_PROXY_IP: 10.241.0.2
    expose:
      - "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      private:
        ipv4_address: 10.241.0.3

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in .env}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Set DASHBOARD_USERNAME in .env}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?Set DASHBOARD_PASSWORD_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      public: {}
      private:
        ipv4_address: 10.241.0.2

networks:
  public:
  private:
    ipam:
      config:
        - subnet: 10.241.0.0/24

volumes:
  caddy_data:
  caddy_config:
